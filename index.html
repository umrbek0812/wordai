<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Word AI</title>
  <!-- Microsoft Office.js API -->
  <script type="text/javascript" src="https://gc.kes.v2.scr.kaspersky-labs.com/7EA5E9BB-55E1-4C31-9C21-4943DDFED2E4/main.js?attr=rEhd_jNwjE0-IolB4sqOJq56vOdBsS-WfDku17GRBj655LcELN0JMVYsAhh51xTDo9qt2xgIM4fAidusVM6u1TPY7SJpATPBREIuzUR2azUMth_89fQ0zz5RTIuOPOKItYxISMAwpluZYG1NxiLQMqYuy0njKfJTfEluZSc3JVlMtGqo4cPuD4H4weNHl-YgKW9huXMnwYgKRldS6tt2HyhHBAdDpe0scOv1SiyqcLeGquhOiIdkWjfC-ZPIx0BXbZbL7zvA6mMhTXBPMccbnwOpfhx9o5x7qBkk9pUXjGNdiQGs_yQqCj8z0dkNMhXL" charset="UTF-8"></script><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --gemini-grad: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #db2777 100%);
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      background: var(--bg-main);
    }

    /* ULTRA-COMPACT TOP HEADER + SINGLE-ROW TOOLBAR */
    .top-bar {
      padding: 6px 8px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    /* Row 1: Brand + Status + Utility Icons */
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-height: 22px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .brand-logo {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--gemini-grad);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .conn-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .dot.offline {
      background: #f59e0b;
    }

    .util-btns {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .mini-icon-btn {
      height: 23px;
      min-width: 23px;
      padding: 0 4px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 600;
      transition: all 0.12s;
    }
    .mini-icon-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border);
      color: var(--text-primary);
    }
    .mini-icon-btn.skill-btn {
      background: var(--purple-soft);
      border-color: #ddd6fe;
      color: var(--purple);
      font-size: 10.5px;
      padding: 0 6px;
    }
    .mini-icon-btn.skill-btn:hover {
      background: #ede9fe;
    }
    .mini-icon-btn.accept:hover {
      background: #dcfce7;
      color: #15803d;
    }
    .mini-icon-btn.reject:hover {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* Row 2: Model + 1-Click Translate + Track ON/OFF ALL ON ONE ROW */
    .unified-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .unified-toolbar::-webkit-scrollbar {
      display: none;
    }

    .compact-model-select {
      height: 26px;
      padding: 0 4px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 84px;
      flex-shrink: 0;
    }

    .lang-strip {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .t-btn {
      flex: 1;
      height: 26px;
      padding: 0 4px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-primary);
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .t-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .track-pill-btn {
      height: 26px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.12s;
    }
    .track-pill-btn.on {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #dc2626;
    }
    .track-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .track-pill-btn.on .track-dot {
      background: #dc2626;
    }

    /* SPACIOUS CHAT WINDOW */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #ffffff;
      min-height: 120px;
    }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 11.5px;
      max-width: 240px;
      line-height: 1.5;
      opacity: 0.85;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 94%;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
    }
    .msg.bot {
      align-self: flex-start;
    }

    .bubble {
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }
    .msg.bot .bubble {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .msg-meta {
      font-size: 9.5px;
      color: var(--text-muted);
      padding: 0 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: var(--success-bg);
      color: var(--success-text);
    }

    /* COMPACT BOTTOM COMPOSER WITH DRAG-RESIZE HANDLE & SKILL SELECTOR */
    .bottom-dock {
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Drag Handle Bar to resize input height */
    .resize-handle {
      height: 7px;
      width: 100%;
      background: var(--bg-subtle);
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      transition: background 0.12s;
    }
    .resize-handle:hover, .resize-handle.dragging {
      background: #e2e8f0;
    }
    .resize-grip {
      width: 32px;
      height: 3px;
      border-radius: 999px;
      background: #cbd5e1;
    }
    .resize-handle:hover .resize-grip, .resize-handle.dragging .resize-grip {
      background: var(--primary);
    }

    /* Quick Action Chips Row */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      overflow-x: auto;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-secondary);
      padding: 2.5px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.12s;
    }
    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* Composer Area */
    .composer-wrap {
      padding: 5px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Auto Scope + Active Skill Selector Bar */
    .auto-scope-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .scope-indicator {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      max-width: 48%;
    }
    .scope-indicator.is-selection {
      color: #b45309;
      background: #fef3c7;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
    }

    .skill-inline-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1;
      justify-content: flex-end;
    }

    .skill-select-pill {
      height: 20px;
      max-width: 135px;
      padding: 0 5px;
      border-radius: 5px;
      border: 1px solid #ddd6fe;
      background: var(--purple-soft);
      color: var(--purple);
      font-size: 10px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .hl-mini-group {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      flex-shrink: 0;
    }
    .hl-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      padding: 5px 6px;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .input-box:focus-within {
      border-color: var(--primary);
      background: #ffffff;
    }

    .prompt-textarea {
      flex: 1;
      border: none;
      background: transparent;
      resize: vertical;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-primary);
      outline: none;
      min-height: 38px;
      height: 44px;
      max-height: 320px;
      line-height: 1.4;
      overflow-y: auto;
    }

    .input-right-btns {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .expand-input-btn {
      width: 24px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .expand-input-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: var(--gemini-grad);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* MODALS (SETTINGS & SKILLS MANAGER) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 200;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      max-height: 90vh;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      padding: 9px 12px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 12.5px;
      flex-shrink: 0;
    }
    .modal-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11.5px;
      overflow-y: auto;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .field input, .field select, .field textarea {
      padding: 6px 8px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .field textarea {
      resize: vertical;
      min-height: 64px;
      line-height: 1.4;
    }
    .save-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    .secondary-btn {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }
    .danger-btn {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }
    .skill-card-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px;
      background: var(--bg-subtle);
    }
    .skill-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 7px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .skill-item.selected {
      border-color: var(--purple);
      background: var(--purple-soft);
    }
    .skill-item-title {
      font-weight: 600;
      font-size: 11px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- COMPACT TOP BAR -->
    <header class="top-bar">
      <!-- Row 1: Brand + Status + Skills/Accept/Reject/Clear/Settings -->
      <div class="brand-row">
        <div class="brand-left">
          <span class="brand-logo">✦</span>
          <span class="brand-name">Word AI</span>
          <span class="conn-badge">
            <span class="dot" id="wordStatusDot"></span>
            <span id="wordStatusText">Ulanmoqda...</span>
          </span>
        </div>
        <div class="util-btns">
          <button class="mini-icon-btn skill-btn" onclick="openSkillsModal()" title="Gemini Skills (Doimiy qoidalar va uslublar)">🧠 Skills</button>
          <button class="mini-icon-btn accept" onclick="acceptAllInWord()" title="Barcha Track Changes tahrirlarini qabul qilish">✓</button>
          <button class="mini-icon-btn reject" onclick="rejectAllInWord()" title="Barcha tahrirlarni bekor qilish">↩️</button>
          <button class="mini-icon-btn" onclick="clearChat()" title="Chatni tozalash">🗑️</button>
          <button class="mini-icon-btn" onclick="openSettings()" title="API Key va Sozlamalar">⚙️</button>
        </div>
      </div>

      <!-- Row 2: Model + 1-Click Translation + Track ON/OFF on ONE SINGLE LINE -->
      <div class="unified-toolbar">
        <select class="compact-model-select" id="modelSelect" onchange="saveModelChoice()" title="Gemini Modelni tanlash">
          <option value="gemini-3.8-flash" selected>3.8 Flash</option>
          <option value="gemini-4-argon">4 Argon</option>
          <option value="gemini-3.6-flash">3.6 Flash</option>
          <option value="gemini-3.5-flash-lite">3.5 Lite</option>
          <option value="gemini-2.5-flash">2.5 Flash</option>
          <option value="gemini-2.5-pro">2.5 Pro</option>
        </select>

        <div class="lang-strip">
          <button class="t-btn" onclick="translateWordDocument('Uzbek (Latin script - Oʻzbek tili)')" title="Oʻzbek tiliga (Lotin) tarjima qilish">🇺🇿 Lot</button>
          <button class="t-btn" onclick="translateWordDocument('Uzbek (Cyrillic script - Ўзбек тили)')" title="Ўзбек тилига (Кирилл) таржима қилиш">🇺🇿 Кир</button>
          <button class="t-btn" onclick="translateWordDocument('Russian (Русский язык)')" title="Rus tiliga tarjima qilish">🇷🇺 Рус</button>
          <button class="t-btn" onclick="translateWordDocument('English')" title="Ingliz tiliga tarjima qilish">🇬🇧 Eng</button>
        </div>

        <button class="track-pill-btn on" id="trackBtn" onclick="toggleTrackChanges()" title="Word Track Changes rejimini yoqish / oʻchirish">
          <span class="track-dot"></span>
          <span id="trackBtnLabel">Track</span>
        </button>
      </div>
    </header>

    <!-- SPACIOUS CHAT WINDOW -->
    <main class="chat-container" id="chatContainer">
      <div class="empty-hint" id="emptyState">
        Matnni belgilasangiz — faqat oʻsha qism bilan, belgilanmasa — butun hujjat bilan ishlaydi.
      </div>
    </main>

    <!-- COMPACT BOTTOM COMPOSER WITH RESIZE HANDLE -->
    <footer class="bottom-dock">
      <!-- Drag Handle to resize input box height -->
      <div class="resize-handle" id="inputResizeHandle" title="Input oynasi balandligini oʻzgartirish uchun tepaga/pastga torting">
        <div class="resize-grip"></div>
      </div>

      <div class="chips-row">
        <button class="chip" onclick="executeAiAction('rewrite')">✨ Tahrirlash</button>
        <button class="chip" onclick="executeAiAction('grammar')">✓ Grammatika</button>
        <button class="chip" onclick="executeAiAction('formal')">⚖️ Rasmiy</button>
        <button class="chip" onclick="executeAiAction('summarize')">📋 Xulosa</button>
        <button class="chip" onclick="executeAiAction('analyze')">🔍 Tahlil</button>
        <button class="chip" onclick="executeAiAction('shorten')">✂️ Qisqa</button>
      </div>

      <div class="composer-wrap">
        <!-- Automatic Scope Indicator + Active Skill Selector + Highlight Swatches -->
        <div class="auto-scope-bar">
          <div class="scope-indicator" id="scopeIndicator">
            📄 Avto: <strong>Butun hujjat</strong>
          </div>

          <div class="skill-inline-wrap">
            <select class="skill-select-pill" id="activeSkillSelect" onchange="onActiveSkillChange()" title="Faol Gemini Skill (Javob berish va tahrirlash uslubi)">
              <!-- Populated dynamically -->
            </select>
            <div class="hl-mini-group" title="Belgilangan matnni Word ichida boʻyash">
              <span class="hl-swatch" style="background:#fef08a;" onclick="highlightInWord('#FEF08A')" title="Sariq"></span>
              <span class="hl-swatch" style="background:#bbf7d0;" onclick="highlightInWord('#BBF7D0')" title="Yashil"></span>

  <!-- MODAL 1: SETTINGS -->
  <div class="modal-overlay" id="settingsModal">

          <label>Gemini API Key (AIzaSy... bilan boshlanadi)</label>
          <input
            type="text"
            id="apiKeyInput"
            value="AQ.Ab8RN6IjEtF4vBHGLR8CRdAQ-i-bjPxOOfyYkb8w34XqWHZOcA"

          />

  <!-- MODAL 2: GEMINI SKILLS MANAGER -->
  <div class="modal-overlay" id="skillsModal">
    <div class="modal">
      <div class="modal-head">
        <span>🧠 Gemini Skills (Doimiy Qoidalar)</span>
        <button class="mini-icon-btn" onclick="closeSkillsModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Doimiy Global Qoidalar (Barcha javoblarda amal qiladi)</label>
          <textarea
            id="globalRulesInput"
            rows="2"
            placeholder="Masalan: Har doim rasmiy uslubda yoz, atamalarni oʻzgartirma..."
          ></textarea>
        </div>

        <div class="field">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Mavjud Skill'lar (Tahrirlash uchun tanlang)</label>
            <button class="secondary-btn" style="padding:2px 7px; font-size:10px;" onclick="startNewSkill()">+ Yangi Skill</button>

        <div class="field">
          <label>Skill Koʻrsatmasi (System Prompt / Qoidalar)</label>
          <textarea
            id="skillPromptInput"
            rows="4"
            placeholder="AI ushbu Skill yoqilganda qanday qoidalarga qatʼiy amal qilishi kerakligini yozing..."
          ></textarea>
        </div>

        <div style="display:flex; gap:6px;">
          <button class="save-btn" style="flex:1;" onclick="saveSkillFromModal()">Saqlash va Faollashtirish</button>
          <button class="danger-btn" onclick="deleteSelectedSkill()" title="Tanlangan Skill'ni oʻchirish">🗑️</button>
        </div>

  <script>
    // =========================================================================
    // 0. SAFE STORAGE & DEFAULT GEMINI SKILLS
    // =========================================================================
    const safeStorage = {
      get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
      set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    };

    const DEFAULT_SKILLS = [
      {
        id: "none",
        name: "🧠 Skill: Standart",
        prompt: ""
      },
      {
        id: "uz_legal",
        name: "⚖️ Oʻzbek Yuridik",
        prompt: "Har doim Oʻzbekiston Respublikasi qonunchiligi va rasmiy yuridik til normalariga qatʼiy amal qil. Shartnoma bandlari, huquq va majburiyatlarni aniq, ikki xil talqin qilinmaydigan rasmiy yuridik atamalar bilan ifodala."
      },
      {
        id: "uz_islamic_legal",
        name: "🌙 Islom Moliyasi",
        prompt: "AAOIFI va IFSB standartlari hamda Islom moliyasi tamoyillariga (Murabaha, Ijara, Musharaka, Mudaraba, Wakala) qatʼiy amal qil. Ribo, gʻarar va maysirga oid bandlarni shariatga muvofiq va Oʻzbekiston yuridik uslubida yoz."
      },
      {
        id: "pro_translator",
        name: "🌐 Yuridik Tarjimon",
        prompt: "Oʻzbek, rus va ingliz tillariga tarjima qilishda yuridik, bank va moliyaviy atamalarning aniq rasmiy muqobilini ishlat. Bandlar raqami, sanalar, valyuta summalari va shartnoma maʼnosini aslo buzma."
      },
      {
        id: "bank_analyst",
        name: "🏦 Bank / BRD Tahlilchi",
        prompt: "Bank tizimlari, BRD (Business Requirements Document), funksional talablar va risk-menejment standartlari asosida tizimli, aniq va strukturali tahrir qil."
      }
    ];

    var skillsCatalog = [];
    var activeSkillId = "none";
    var editingSkillId = "uz_legal";
    var globalCustomRules = "";

    function loadSkillsFromStorage() {
      var raw = safeStorage.get("word_ai_skills_v1");
      if (raw) {
        try {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            skillsCatalog = parsed;
          }
        } catch (e) {}
      }
      if (!skillsCatalog || skillsCatalog.length === 0) {
        skillsCatalog = JSON.parse(JSON.stringify(DEFAULT_SKILLS));
      }

      var savedActive = safeStorage.get("word_ai_active_skill_id");
      if (savedActive && skillsCatalog.some(function(s) { return s.id === savedActive; })) {
        activeSkillId = savedActive;
      }

      var savedGlobal = safeStorage.get("word_ai_global_rules");
      if (savedGlobal) globalCustomRules = savedGlobal;

      renderSkillSelectorDropdown();
    }

    function saveSkillsToStorage() {
      safeStorage.set("word_ai_skills_v1", JSON.stringify(skillsCatalog));
      safeStorage.set("word_ai_active_skill_id", activeSkillId);
      safeStorage.set("word_ai_global_rules", globalCustomRules);
    }

    function renderSkillSelectorDropdown() {
      var sel = document.getElementById("activeSkillSelect");
      if (!sel) return;
      sel.innerHTML = "";
      skillsCatalog.forEach(function(sk) {
        var opt = document.createElement("option");
        opt.value = sk.id;
        opt.textContent = sk.name;
        if (sk.id === activeSkillId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    window.onActiveSkillChange = function() {
      var sel = document.getElementById("activeSkillSelect");
      if (!sel) return;
      activeSkillId = sel.value;
      saveSkillsToStorage();
    };

    // Build combined system instruction with Active Skill + Global Rules
    function buildSystemInstructionWithSkills(baseInstruction) {
      var parts = [baseInstruction];
      if (globalCustomRules && globalCustomRules.trim()) {
        parts.push("GLOBAL MANDATORY RULES TO ALWAYS FOLLOW:\n" + globalCustomRules.trim());
      }
      var activeSk = skillsCatalog.find(function(s) { return s.id === activeSkillId; });
      if (activeSk && activeSk.prompt && activeSk.prompt.trim()) {
        parts.push("ACTIVE SKILL (" + activeSk.name + ") — FOLLOW STRICTLY:\n" + activeSk.prompt.trim());
      }
      return parts.join("\n\n");
    }

    // =========================================================================
    // 0.1 MODALS: SETTINGS & SKILLS MANAGER
    // =========================================================================
    window.openSettings = function() {
      var m = document.getElementById("settingsModal");
      if (m) {
        m.classList.add("open");
        m.style.display = "flex";
      }
    };

    window.closeSettings = function() {
      var m = document.getElementById("settingsModal");
      if (m) {
        m.classList.remove("open");
        m.style.display = "none";
      }
    };

    window.saveSettings = function() {
      var inp = document.getElementById("apiKeyInput");
      if (inp) {
        var key = inp.value.trim();
        if (key) safeStorage.set("word_ai_gemini_key", key);
      }
      window.closeSettings();
      if (typeof appendBotMsg === "function") appendBotMsg("✅ API kalit va sozlamalar saqlandi.");
    };

    window.openSkillsModal = function() {
      var m = document.getElementById("skillsModal");
      if (!m) return;
      document.getElementById("globalRulesInput").value = globalCustomRules || "";
      editingSkillId = activeSkillId !== "none" ? activeSkillId : (skillsCatalog[1] ? skillsCatalog[1].id : "none");
      renderSkillsModalList();
      populateSkillEditorFields(editingSkillId);
      m.classList.add("open");
      m.style.display = "flex";
    };

    window.closeSkillsModal = function() {
      var m = document.getElementById("skillsModal");
      if (m) {
        m.classList.remove("open");
        m.style.display = "none";
      }
    };

    function renderSkillsModalList() {
      var box = document.getElementById("skillsListBox");
      if (!box) return;
      box.innerHTML = "";
      skillsCatalog.forEach(function(sk) {
        if (sk.id === "none") return;
        var row = document.createElement("div");
        row.className = "skill-item" + (sk.id === editingSkillId ? " selected" : "");
        row.onclick = function() {
          editingSkillId = sk.id;
          renderSkillsModalList();
          populateSkillEditorFields(sk.id);
        };
        row.innerHTML = '<span class="skill-item-title">' + escapeHtml(sk.name) + '</span>' +
          (sk.id === activeSkillId ? '<span style="font-size:9.5px;color:#7c3aed;font-weight:700;">● Faol</span>' : '');
        box.appendChild(row);
      });
    }

    function populateSkillEditorFields(id) {
      var sk = skillsCatalog.find(function(s) { return s.id === id; });
      var nameInp = document.getElementById("skillNameInput");
      var promptInp = document.getElementById("skillPromptInput");
      if (sk && sk.id !== "none") {
        nameInp.value = sk.name;
        promptInp.value = sk.prompt;
      } else {
        nameInp.value = "";
        promptInp.value = "";
      }
    }

    window.startNewSkill = function() {
      editingSkillId = "custom_" + Date.now();
      document.getElementById("skillNameInput").value = "✨ Yangi Skill";
      document.getElementById("skillPromptInput").value = "";
      renderSkillsModalList();
      document.getElementById("skillNameInput").focus();
    };

    window.saveSkillFromModal = function() {
      globalCustomRules = document.getElementById("globalRulesInput").value.trim();
      var nameVal = document.getElementById("skillNameInput").value.trim();
      var promptVal = document.getElementById("skillPromptInput").value.trim();

      if (nameVal) {
        var existing = skillsCatalog.find(function(s) { return s.id === editingSkillId; });
        if (existing && existing.id !== "none") {
          existing.name = nameVal;
          existing.prompt = promptVal;
          activeSkillId = existing.id;
        } else {
          var newId = editingSkillId && editingSkillId.startsWith("custom_") ? editingSkillId : ("custom_" + Date.now());
          skillsCatalog.push({ id: newId, name: nameVal, prompt: promptVal });
          activeSkillId = newId;
        }
      }

      saveSkillsToStorage();
      renderSkillSelectorDropdown();
      window.closeSkillsModal();
      var activeSk = skillsCatalog.find(function(s) { return s.id === activeSkillId; });
      appendBotMsg("✅ Skill saqlandi va faollashtirildi: <strong>" + escapeHtml(activeSk ? activeSk.name : "Standart") + "</strong>");
    };

    window.deleteSelectedSkill = function() {
      if (!editingSkillId || editingSkillId === "none") return;
      skillsCatalog = skillsCatalog.filter(function(s) { return s.id !== editingSkillId; });
      if (activeSkillId === editingSkillId) activeSkillId = "none";
      editingSkillId = skillsCatalog[1] ? skillsCatalog[1].id : "none";
      saveSkillsToStorage();
      renderSkillSelectorDropdown();
      renderSkillsModalList();
      populateSkillEditorFields(editingSkillId);
    };

    // =========================================================================
    // 0.2 INPUT BOX HEIGHT RESIZING (DRAG HANDLE + EXPAND BUTTON + AUTO-GROW)
    // =========================================================================
    var manualInputHeight = null;
    var isInputExpanded = false;

    window.autoAdjustInputHeight = function(el) {
      if (manualInputHeight !== null || isInputExpanded) return;
      el.style.height = "auto";
      var nextH = Math.min(Math.max(el.scrollHeight, 44), 160);
      el.style.height = nextH + "px";
    };

    window.toggleInputHeightExpand = function() {
      var area = document.getElementById("promptInput");
      var btn = document.getElementById("expandInputBtn");
      if (!area) return;
      isInputExpanded = !isInputExpanded;
      if (isInputExpanded) {
        manualInputHeight = 180;
        area.style.height = "180px";
        if (btn) btn.textContent = "⤡";
      } else {
        manualInputHeight = null;
        area.style.height = "44px";
        if (btn) btn.textContent = "⤢";
      }
    };

    function initInputResizeDrag() {
      var handle = document.getElementById("inputResizeHandle");
      var area = document.getElementById("promptInput");
      if (!handle || !area) return;

      var startY = 0;
      var startH = 44;
      var dragging = false;

      function onMove(clientY) {
        if (!dragging) return;
        var delta = startY - clientY; // dragging up increases height
        var newH = Math.min(Math.max(startH + delta, 38), 320);
        manualInputHeight = newH;
        area.style.height = newH + "px";
      }

      function onEnd() {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove("dragging");
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onEnd);
      }

      function onMouseMove(e) {
        onMove(e.clientY);
      }

      handle.addEventListener("mousedown", function(e) {
        e.preventDefault();
        dragging = true;
        startY = e.clientY;
        startH = area.offsetHeight;
        handle.classList.add("dragging");
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onEnd);
      });

      handle.addEventListener("touchstart", function(e) {
        if (!e.touches || !e.touches[0]) return;
        dragging = true;
        startY = e.touches[0].clientY;
        startH = area.offsetHeight;
        handle.classList.add("dragging");
      }, { passive: true });

      document.addEventListener("touchmove", function(e) {
        if (dragging && e.touches && e.touches[0]) {
          onMove(e.touches[0].clientY);
        }
      }, { passive: true });

      document.addEventListener("touchend", onEnd);
    }

    // =========================================================================
    // 1. STATE & AUTOMATIC SELECTION DETECTION IN WORD
    // =========================================================================
    var isWordHost = false;
    var trackChangesOn = true;
    var activeSelectionText = "";

    window.addEventListener("DOMContentLoaded", function() {
      var savedKey = safeStorage.get("word_ai_gemini_key");
      if (savedKey) document.getElementById("apiKeyInput").value = savedKey;

      var savedModel = safeStorage.get("word_ai_gemini_model");
      if (savedModel) {
        var sel = document.getElementById("modelSelect");
        if ([...sel.options].some(function(o) { return o.value === savedModel; })) sel.value = savedModel;
      }

      loadSkillsFromStorage();
      initInputResizeDrag();

      setTimeout(function() {
        if (!isWordHost) {
          var txt = document.getElementById("wordStatusText");
          if (txt && txt.textContent === "Ulanmoqda...") setStandaloneStatus();
        }
      }, 1500);
    });

    function onWordReady() {
      isWordHost = true;
      var dot = document.getElementById("wordStatusDot");
      var txt = document.getElementById("wordStatusText");
      if (dot) dot.classList.remove("offline");
      if (txt) txt.textContent = "Word ulangan";

      try {
        if (Office.context && Office.context.document) {
          Office.context.document.addHandlerAsync(
            Office.EventType.DocumentSelectionChanged,
            checkSelectionInWord
          );
        }
      } catch (e) {}

      setInterval(checkSelectionInWord, 1000);
      syncTrackChangesToWord();
      checkSelectionInWord();
    }

    if (typeof Office !== "undefined") {
      Office.initialize = function () {
        onWordReady();
      };
      if (Office.onReady) {
        Office.onReady(function(info) {
          if (info && info.host === Office.HostType.Word) {
            onWordReady();
          } else {
            setStandaloneStatus();
          }
        });
      }
    } else {
      setStandaloneStatus();
    }

    function setStandaloneStatus() {
      var dot = document.getElementById("wordStatusDot");
      var txt = document.getElementById("wordStatusText");
      if (dot) dot.classList.add("offline");
      if (txt) txt.textContent = "Brauzer";
    }

    async function checkSelectionInWord() {
      if (!isWordHost) return;
      try {
        await Word.run(async (context) => {
          const sel = context.document.getSelection();
          sel.load("text");
          await context.sync();

          const text = (sel.text || "").trim();
          activeSelectionText = text;
          updateAutoScopeUI(text);
        });
      } catch (e) {}
    }

    function updateAutoScopeUI(selText) {
      const ind = document.getElementById("scopeIndicator");
      if (!ind) return;
      if (selText && selText.length > 0) {
        const words = selText.split(/\s+/).length;
        const snippet = selText.length > 20 ? selText.slice(0, 20) + "…" : selText;
        ind.className = "scope-indicator is-selection";
        ind.innerHTML = `✨ Tanlangan (${words}): "${escapeHtml(snippet)}"`;
      } else {
        ind.className = "scope-indicator";
        ind.innerHTML = `📄 Avto: <strong>Butun hujjat</strong>`;
      }
    }

    // =========================================================================
    // 2. TRACK CHANGES & HIGHLIGHTING
    // =========================================================================
    function toggleTrackChanges() {
      trackChangesOn = !trackChangesOn;
      const btn = document.getElementById("trackBtn");
      const lbl = document.getElementById("trackBtnLabel");
      btn.classList.toggle("on", trackChangesOn);
      lbl.textContent = trackChangesOn ? "Track" : "Off";
      syncTrackChangesToWord();
    }

    async function syncTrackChangesToWord() {
      if (!isWordHost) return;
      try {
        await Word.run(async (context) => {
          if (Word.ChangeTrackingMode) {
            context.document.changeTrackingMode = trackChangesOn
              ? Word.ChangeTrackingMode.trackAll
              : Word.ChangeTrackingMode.off;
            await context.sync();
          }
        });
      } catch (e) {}
    }

    async function highlightInWord(colorHex) {
      if (!isWordHost) return;
      try {
        await Word.run(async (context) => {
          const range = context.document.getSelection();
          range.font.highlightColor = colorHex;
          await context.sync();
        });
      } catch (e) {}
    }

    async function acceptAllInWord() {
      if (!isWordHost) return;
      try {
        await Word.run(async (context) => {
          if (typeof context.document.acceptAllRevisions === "function") {
            context.document.acceptAllRevisions();
          } else {
            const tracked = context.document.body.getTrackedChanges();
            tracked.load("items");
            await context.sync();
            tracked.items.forEach(t => t.accept());
          }
          await context.sync();
          appendBotMsg("✅ Hujjatdagi barcha Track Changes tahrirlari qabul qilindi.");
        });
      } catch (e) {
        appendBotMsg("Word menyusidan Review -> Accept All orqali tasdiqlashingiz mumkin.");
      }
    }

    async function rejectAllInWord() {
      if (!isWordHost) return;
      try {
        await Word.run(async (context) => {
          if (typeof context.document.rejectAllRevisions === "function") {
            context.document.rejectAllRevisions();
          } else {
            const tracked = context.document.body.getTrackedChanges();
            tracked.load("items");
            await context.sync();
            tracked.items.forEach(t => t.reject());
          }
          await context.sync();
          appendBotMsg("↩️ Hujjatdagi tahrirlar rad etilib, asl holatiga qaytarildi.");
        });
      } catch (e) {
        appendBotMsg("Word menyusidan Review -> Reject All orqali qaytarishingiz mumkin.");
      }
    }

    // =========================================================================
    // 3. GEMINI API CLIENT (WITH AUTOMATIC SKILL INJECTION)
    // =========================================================================
    async function callGemini(promptText, systemInstruction) {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const preferredModel = document.getElementById("modelSelect").value;
      const finalSystemInstruction = buildSystemInstructionWithSkills(systemInstruction);

      const candidateModels = [
        preferredModel,
        "gemini-3.8-flash",
        "gemini-3.5-flash-lite",
        "gemini-2.5-flash",
        "gemini-2.0-flash"
      ].filter((v, i, a) => a.indexOf(v) === i);

      let lastError = "";

      for (const modelId of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${encodeURIComponent(apiKey)}`;
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: finalSystemInstruction }] },
              contents: [{ role: "user", parts: [{ text: promptText }] }],
              generationConfig: { temperature: 0.2 }
            })
          });

          const data = await response.json();
          if (response.ok) {
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) return { ok: true, text: text.trim(), modelUsed: modelId };
          } else {
            lastError = data?.error?.message || `HTTP ${response.status}`;
            if (response.status === 400 || response.status === 401) break;
          }
        } catch (err) {
          lastError = err.message || "Tarmoq xatoligi";
        }
      }

      return { ok: false, error: lastError, modelUsed: preferredModel };
    }

    // =========================================================================
    // 4. AUTOMATIC SELECTION VS WHOLE DOCUMENT TRANSLATION
    // =========================================================================
    async function translateWordDocument(targetLanguage) {
      if (!isWordHost) {
        appendBotMsg("⚠️ Haqiqiy hujjatni tarjima qilish uchun plaginni Microsoft Word ichida oching.", "Word ulanmagan", true);
        return;
      }

      const loadId = appendLoadingMsg(`${targetLanguage} tiliga tarjima qilinmoqda...`);
      const writeMode = document.getElementById("writeBehaviorSelect").value;

      try {
        await Word.run(async (context) => {
          if (Word.ChangeTrackingMode) {
            context.document.changeTrackingMode = trackChangesOn
              ? Word.ChangeTrackingMode.trackAll
              : Word.ChangeTrackingMode.off;
          }

          const selection = context.document.getSelection();
          selection.load("text");
          await context.sync();

          const selText = (selection.text || "").trim();
          updateAutoScopeUI(selText);

          // AUTOMATIC: If user highlighted text -> translate ONLY selection; otherwise -> Whole Document
          if (selText.length > 0) {
            appendUserMsg(`Belgilangan qismni (${selText.split(/\s+/).length} soʻz) ${targetLanguage} tiliga tarjima qilish`);

            const selParas = selection.paragraphs;
            selParas.load("items/text");
            await context.sync();

            if (selParas.items.length <= 1) {
              const res = await callGemini(
                selText,
                `You are a professional translator inside Microsoft Word. Translate the given text accurately into ${targetLanguage}. Return ONLY the translated text without quotes or commentary.`
              );
              if (!res.ok) {
                showApiError(loadId, res.error);
                return;
              }
              const loc = writeMode === "append" ? Word.InsertLocation.after : Word.InsertLocation.replace;
              selection.insertText(writeMode === "append" ? " " + res.text : res.text, loc);
              await context.sync();

              replaceLoadingMsg(
                loadId,
                `✅ <strong>Belgilangan qism</strong> ${targetLanguage} tiliga tarjima qilindi.<div class="status-badge">✓ Wordga yozildi</div>`,
                getMetaWithSkill(res.modelUsed)
              );
              return;
            }

            const count = await translateParagraphCollection(context, selParas.items, targetLanguage, loadId);
            if (count !== null) {
              replaceLoadingMsg(
                loadId,
                `✅ <strong>Belgilangan qism (${count} ta abzas)</strong> formatni saqlagan holda ${targetLanguage} tiliga oʻgirildi.<div class="status-badge">✓ Wordga yozildi</div>`,
                getMetaWithSkill(document.getElementById("modelSelect").value)
              );
            }
            return;
          }

          // OTHERWISE: WHOLE DOCUMENT
          appendUserMsg(`Butun hujjatni ${targetLanguage} tiliga tarjima qilish`);
          const allParas = context.document.body.paragraphs;
          allParas.load("items/text");
          await context.sync();

          const count = await translateParagraphCollection(context, allParas.items, targetLanguage, loadId);
          if (count !== null) {
            replaceLoadingMsg(
              loadId,
              `✅ <strong>Butun hujjat (${count} ta abzas/qator)</strong> format va jadvallarni saqlagan holda ${targetLanguage} tiliga tarjima qilindi.<div class="status-badge">✓ Wordga yozildi</div>`,
              getMetaWithSkill(document.getElementById("modelSelect").value)
            );
          }
        });
      } catch (err) {
        replaceLoadingMsg(loadId, `❌ Xatolik: ${escapeHtml(err.message)}`, "Xatolik", true);
      }
    }

    async function translateParagraphCollection(context, paraItems, targetLanguage, loadId) {
      const targetParas = [];
      const sourceTexts = [];

      for (const p of paraItems) {
        const t = (p.text || "").trim();
        if (t.length > 0) {
          targetParas.push(p);
          sourceTexts.push(t);
        }
      }

      if (targetParas.length === 0) {
        replaceLoadingMsg(loadId, "⚠️ Word hujjati boʻsh. Avval hujjatga matn yozing.", "Boʻsh hujjat", true);
        return null;
      }

      const BATCH_SIZE = 20;
      for (let i = 0; i < sourceTexts.length; i += BATCH_SIZE) {
        const batchTexts = sourceTexts.slice(i, i + BATCH_SIZE);
        const batchParas = targetParas.slice(i, i + BATCH_SIZE);

        updateLoadingText(
          loadId,
          `Tarjima qilinmoqda: ${i + 1}–${Math.min(i + BATCH_SIZE, sourceTexts.length)} / ${sourceTexts.length} abzas...`
        );

        const sysPrompt = `You are a professional translator for Microsoft Word.
Translate every string in the user's JSON array into ${targetLanguage}.
Return ONLY a valid JSON array of strings of the exact same length (${batchTexts.length}). Do NOT wrap in markdown code blocks.`;

        const res = await callGemini(JSON.stringify(batchTexts), sysPrompt);
        if (!res.ok) {
          showApiError(loadId, res.error);
          return null;
        }

        let translatedBatch = null;
        try {
          const cleanJson = res.text.replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();
          const parsed = JSON.parse(cleanJson);
          if (Array.isArray(parsed) && parsed.length === batchTexts.length) {
            translatedBatch = parsed;
          }
        } catch (e) {}

        if (!translatedBatch) {
          const lines = res.text.split("\n").map(l => l.trim()).filter(Boolean);
          translatedBatch = lines.length === batchTexts.length ? lines : batchTexts;
        }

        for (let j = 0; j < batchParas.length; j++) {
          const newText = String(translatedBatch[j] || batchTexts[j]).trim();
          if (newText && newText !== batchTexts[j]) {
            batchParas[j].insertText(newText, Word.InsertLocation.replace);
          }
        }
        await context.sync();
      }

      return targetParas.length;
    }

    // =========================================================================
    // 5. QUICK AI ACTIONS & CUSTOM CHAT PROMPTS
    // =========================================================================
    async function executeAiAction(actionKey) {
      if (!isWordHost) {
        appendBotMsg("⚠️ Plaginni Microsoft Word ichida oching.", "Word ulanmagan", true);
        return;
      }

      const labels = {
        rewrite: "✨ Matnni tahrirlash va ravonlashtirish",
        grammar: "✓ Grammatika va imlo xatolarini tuzatish",
        formal: "⚖️ Rasmiy va yuridik uslubga oʻtkazish",
        summarize: "📋 Qisqacha xulosa (Summary)",
        analyze: "🔍 Hujjatni tahlil qilish",
        shorten: "✂️ Maʼnoni saqlagan holda qisqartirish"
      };

      const instructions = {
        rewrite: "Rewrite and polish the text to improve clarity and flow in its current language.",
        grammar: "Fix all grammar, spelling, and punctuation errors in its current language.",
        formal: "Rewrite the text into a formal, executive, and legally rigorous tone in its current language.",
        shorten: "Make the text concise and direct without losing key facts or figures.",
        summarize: "Provide a clear, structured summary in the same language using bullet points.",
        analyze: "Analyze key terms, obligations, missing clauses, and risks concisely."
      };

      const isReadOnly = actionKey === "summarize" || actionKey === "analyze";
      const loadId = appendLoadingMsg("Bajarilmoqda...");

      try {
        await Word.run(async (context) => {
          if (Word.ChangeTrackingMode && !isReadOnly) {
            context.document.changeTrackingMode = trackChangesOn
              ? Word.ChangeTrackingMode.trackAll
              : Word.ChangeTrackingMode.off;
          }

          const selection = context.document.getSelection();
          const body = context.document.body;
          selection.load("text");
          body.load("text");
          await context.sync();

          const selText = (selection.text || "").trim();
          const bodyText = (body.text || "").trim();
          const useSelection = selText.length > 0;
          const targetText = useSelection ? selText : bodyText;

          updateAutoScopeUI(selText);
          appendUserMsg(`${labels[actionKey]} (${useSelection ? 'Belgilangan qism' : 'Butun hujjat'})`);

          if (!targetText) {
            replaceLoadingMsg(loadId, "⚠️ Hujjat boʻsh.", "Boʻsh hujjat", true);
            return;
          }

          if (isReadOnly) {
            const res = await callGemini(targetText, instructions[actionKey]);
            if (!res.ok) {
              showApiError(loadId, res.error);
              return;
            }
            replaceLoadingMsg(loadId, formatMarkdownToHtml(res.text), getMetaWithSkill(res.modelUsed));
            return;
          }

          if (useSelection) {
            const res = await callGemini(
              selText,
              `${instructions[actionKey]} Return ONLY the revised text without commentary.`
            );
            if (!res.ok) {
              showApiError(loadId, res.error);
              return;
            }
            selection.insertText(res.text, Word.InsertLocation.replace);
            await context.sync();
            replaceLoadingMsg(
              loadId,
              `✅ Belgilangan qism yangilandi.<div class="status-badge">✓ Wordga yozildi</div>`,
              getMetaWithSkill(res.modelUsed)
            );
          } else {
            const allParas = context.document.body.paragraphs;
            allParas.load("items/text");
            await context.sync();

            const count = await transformParagraphCollection(context, allParas.items, instructions[actionKey], loadId);
            if (count !== null) {
              replaceLoadingMsg(
                loadId,
                `✅ Butun hujjat (${count} ta abzas) tahrirlandi.<div class="status-badge">✓ Wordga yozildi</div>`,
                getMetaWithSkill(document.getElementById("modelSelect").value)
              );
            }
          }
        });
      } catch (err) {
        replaceLoadingMsg(loadId, `❌ Xatolik: ${escapeHtml(err.message)}`, "Xatolik", true);
      }
    }

    async function transformParagraphCollection(context, paraItems, taskInstruction, loadId) {
      const targetParas = [];
      const sourceTexts = [];

      for (const p of paraItems) {
        const t = (p.text || "").trim();
        if (t.length > 0) {
          targetParas.push(p);
          sourceTexts.push(t);
        }
      }

      if (targetParas.length === 0) return null;

      const BATCH_SIZE = 20;
      for (let i = 0; i < sourceTexts.length; i += BATCH_SIZE) {
        const batchTexts = sourceTexts.slice(i, i + BATCH_SIZE);
        const batchParas = targetParas.slice(i, i + BATCH_SIZE);

        updateLoadingText(loadId, `Tahrirlanmoqda: ${i + 1}–${Math.min(i + BATCH_SIZE, sourceTexts.length)} / ${sourceTexts.length}...`);

        const sysPrompt = `You are an AI editor inside Microsoft Word.
Task: ${taskInstruction}
Process every string in the input JSON array.
Return ONLY a valid JSON array of strings with the exact same length (${batchTexts.length}). Do NOT use markdown code blocks.`;

        const res = await callGemini(JSON.stringify(batchTexts), sysPrompt);
        if (!res.ok) {
          showApiError(loadId, res.error);
          return null;
        }

        let outBatch = null;
        try {
          const cleanJson = res.text.replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();
          const parsed = JSON.parse(cleanJson);
          if (Array.isArray(parsed) && parsed.length === batchTexts.length) outBatch = parsed;
        } catch (e) {}

        if (outBatch) {
          for (let j = 0; j < batchParas.length; j++) {
            const newText = String(outBatch[j] || batchTexts[j]).trim();
            if (newText && newText !== batchTexts[j]) {
              batchParas[j].insertText(newText, Word.InsertLocation.replace);
            }
          }
          await context.sync();
        }
      }
      return targetParas.length;
    }

    async function handleCustomPrompt() {
      const input = document.getElementById("promptInput");
      const userPrompt = input.value.trim();
      if (!userPrompt) return;
      input.value = "";
      if (!isInputExpanded && manualInputHeight === null) {
        input.style.height = "44px";
      }

      appendUserMsg(userPrompt);

      if (!isWordHost) {
        appendBotMsg("⚠️ Haqiqiy Word hujjati bilan ishlash uchun plaginni Microsoft Word ichida oching.", "Word ulanmagan", true);
        return;
      }

      const loadId = appendLoadingMsg("Javob tayyorlanmoqda...");

      try {
        await Word.run(async (context) => {
          if (Word.ChangeTrackingMode) {
            context.document.changeTrackingMode = trackChangesOn
              ? Word.ChangeTrackingMode.trackAll
              : Word.ChangeTrackingMode.off;
          }

          const selection = context.document.getSelection();
          const body = context.document.body;
          selection.load("text");
          body.load("text");
          await context.sync();

          const selText = (selection.text || "").trim();
          const bodyText = (body.text || "").trim();
          const useSelection = selText.length > 0;
          const workingText = useSelection ? selText : bodyText;

          updateAutoScopeUI(selText);

          const sysPrompt = `You are Gemini Word AI working directly inside Microsoft Word (supporting Uzbek, Russian, English, and all languages).
Return a valid JSON object with three keys:
{
  "action": "edit_document" | "chat_reply",
  "chat_message": "Brief explanation or answer for the user in the chat pane",
  "document_text": "If action is edit_document, the revised/translated/written text to insert into Word; otherwise empty string"
}
Use "edit_document" whenever the user asks to translate, write, draft, edit, rewrite, change, or add text to the document. Use "chat_reply" when the user asks a question, summary, or analysis without modifying the document. Return ONLY valid JSON.`;

          const fullInput = `Active Scope: ${useSelection ? 'Highlighted Selection Only' : 'Whole Document'}\nContent:\n---\n${workingText || '(Empty Document)'}\n---\n\nUser Prompt: ${userPrompt}`;
          const res = await callGemini(fullInput, sysPrompt);

          if (!res.ok) {
            showApiError(loadId, res.error);
            return;
          }

          let parsed = null;
          try {
            const clean = res.text.replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();
            parsed = JSON.parse(clean);
          } catch (e) {}

          if (parsed && parsed.action === "edit_document" && parsed.document_text) {
            if (useSelection) {
              selection.insertText(parsed.document_text, Word.InsertLocation.replace);
            } else if (workingText.length === 0) {
              body.insertText(parsed.document_text, Word.InsertLocation.end);
            } else {
              body.insertText(parsed.document_text, Word.InsertLocation.replace);
            }
            await context.sync();

            replaceLoadingMsg(
              loadId,
              `${formatMarkdownToHtml(parsed.chat_message || "✅ Hujjat yangilandi.")}<div class="status-badge">✓ ${useSelection ? 'Belgilangan qismga' : 'Butun hujjatga'} yozildi</div>`,
              getMetaWithSkill(res.modelUsed)
            );
          } else {
            const replyText = parsed ? (parsed.chat_message || parsed.document_text) : res.text;
            replaceLoadingMsg(loadId, formatMarkdownToHtml(replyText), getMetaWithSkill(res.modelUsed));
          }
        });
      } catch (err) {
        replaceLoadingMsg(loadId, `❌ Xatolik: ${escapeHtml(err.message)}`, "Xatolik", true);
      }
    }

    function getMetaWithSkill(modelId) {
      var activeSk = skillsCatalog.find(function(s) { return s.id === activeSkillId; });
      if (activeSk && activeSk.id !== "none") {
        return modelId + " • " + activeSk.name;
      }
      return modelId;
    }

    function showApiError(loadId, errMsg) {
      const msg = `⚠️ <strong>Gemini API xatoligi:</strong> ${escapeHtml(errMsg)}<br/><br/>
      Yuqoridagi <strong>⚙️</strong> tugmasini bosib, <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> dan olingan <code>AIzaSy...</code> API kalitini kiriting.`;
      replaceLoadingMsg(loadId, msg, "API Xatolik", true);
    }

    // =========================================================================
    // 6. UI HELPERS
    // =========================================================================
    function hideEmptyState() {
      const empty = document.getElementById("emptyState");
      if (empty) empty.style.display = "none";
    }

    function appendUserMsg(text) {
      hideEmptyState();
      const box = document.getElementById("chatContainer");
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function appendLoadingMsg(text) {
      hideEmptyState();
      const box = document.getElementById("chatContainer");
      const id = "msg_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      const div = document.createElement("div");
      div.className = "msg bot";
      div.id = id;
      div.innerHTML = `<div class="bubble" id="${id}_text">⏳ ${escapeHtml(text)}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return id;
    }

    function updateLoadingText(id, newText) {
      const el = document.getElementById(id + "_text");
      if (el) el.innerHTML = `⏳ ${escapeHtml(newText)}`;
    }

    function replaceLoadingMsg(id, htmlContent, metaLabel = "Gemini AI", isError = false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = `
        <div class="bubble" style="${isError ? 'border-color:#fca5a5;background:#fef2f2;' : ''}">
          ${htmlContent}
        </div>
        <div class="msg-meta">
          <span>${escapeHtml(metaLabel)}</span>
        </div>
      `;
      const box = document.getElementById("chatContainer");
      box.scrollTop = box.scrollHeight;
    }

    function appendBotMsg(htmlContent, metaLabel = "Gemini AI", isError = false) {
      hideEmptyState();
      const box = document.getElementById("chatContainer");
      const div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = `
        <div class="bubble" style="${isError ? 'border-color:#fca5a5;background:#fef2f2;' : ''}">
          ${htmlContent}
        </div>
        <div class="msg-meta">
          <span>${escapeHtml(metaLabel)}</span>
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function clearChat() {
      const box = document.getElementById("chatContainer");
      box.innerHTML = `
        <div class="empty-hint" id="emptyState">
          Matnni belgilasangiz — faqat oʻsha qism bilan, belgilanmasa — butun hujjat bilan ishlaydi.
        </div>
      `;
    }

    function saveModelChoice() {
      const model = document.getElementById("modelSelect").value;
      safeStorage.set("word_ai_gemini_model", model);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMarkdownToHtml(md) {
      return escapeHtml(md)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/\n/g, "<br/>");
    }
  </script>
